services:
  zebra:
    image: ghcr.io/refugioos/zebra:6.3.0-refugioos.2
    restart: unless-stopped
    # Tope de RAM del contenedor: 4 GB por defecto (minimo oficial de Zebra,
    # suficiente para un nodo de baja demanda: solo sync). Deja el resto del
    # nodo libre. Si la pagina muestra reinicios por RAM, sube el tope:
    # ZEBRA_MEM_LIMIT=8g (o 12g si la maquina solo corre Zebra).
    mem_limit: ${ZEBRA_MEM_LIMIT:-4g}
    mem_reservation: ${ZEBRA_MEM_RESERVATION:-2g}
    # Rotacion de logs del contenedor (el sync escribe mucho en stdout).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - 8232:8232/tcp
      - 8233:8233/tcp
      - 8080:8080/tcp
    volumes:
      - zebra_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8233' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zebra
  author: RefugioOS
  developer: RefugioOS
  title:
    en_us: Zebra (Zcash Node)
  tagline:
    en_us: Full Zcash node (pure port)
  description:
    en_us: Pure port of the Zcash Foundation's Zebra node. Official SHA256-verified binaries, no forks or patches.
  category: Finance
  index: /
  port_map: "8080:8080"

volumes:
  zebra_data:
