services:
  zebra:
    image: ghcr.io/refugioos/zebra:6.3.0-refugioos.1
    restart: unless-stopped
    ports:
      - 8232:8232/tcp
      - 8233:8233/tcp
      - 8080:8080/tcp
    volumes:
      - zebra_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8233' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zebra
  author: RefugioOS
  developer: RefugioOS
  title:
    en_us: Zebra (Zcash Node)
  tagline:
    en_us: Full Zcash node (pure port)
  description:
    en_us: Pure port of the Zcash Foundation's Zebra node. Official SHA256-verified binaries, no forks or patches.
  category: Finance
  index: /
  port_map: "8080:8080"

volumes:
  zebra_data:
